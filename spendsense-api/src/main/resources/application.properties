# ──────────────────────────────────────────────
# Secrets (DB password, JWT secret, Claude API key) are loaded from
# application-local.properties, which is gitignored.
# Copy application-local.properties.example to get started.
# ──────────────────────────────────────────────
spring.config.import=optional:classpath:application-local.properties

# ──────────────────────────────────────────────
# DataSource — PostgreSQL
# ──────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/spendsense_db
spring.datasource.username=spendsense
spring.datasource.driver-class-name=org.postgresql.Driver

# ──────────────────────────────────────────────
# JPA / Hibernate
# ──────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ──────────────────────────────────────────────
# Flyway
# ──────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ──────────────────────────────────────────────
# JWT
# ──────────────────────────────────────────────

# ──────────────────────────────────────────────
# Claude (Anthropic) API
# ──────────────────────────────────────────────
# claude.api.key and claude.workspace.id live in application-local.properties
# Cost-effective model used for transaction categorization
claude.model=claude-haiku-5-5

# ──────────────────────────────────────────────
# Multipart file upload
# ──────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ──────────────────────────────────────────────
# Error responses — include the reason so the UI can show it
# ──────────────────────────────────────────────
server.error.include-message=always
